[package]
name = "kodo"
version = "0.1.0"
description = "Kodo — Architecture Control Center"
authors = ["Kodo contributors"]
edition = "2021"
rust-version = "1.77.2"
license = "AGPL-3.0"

[lib]
name = "kodo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
