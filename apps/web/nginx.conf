# Kodo web — static Vite bundle + same-origin reverse proxy for the FastAPI orchestrator.
# Runs as the non-root `nginx` user inside nginxinc/nginx-unprivileged, hence the unprivileged port.
server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Source files and generated container artifacts are posted as JSON.
    client_max_body_size 32m;

    # SPA fallback: client-side routes resolve to the single index.html shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # DeepSeek / Ollama requests can legitimately take tens of seconds.
    location /api/ {
        proxy_pass http://api-python:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        # GitHub OAuth needs the session/state cookies and the callback's Set-Cookie to pass through.
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;
        proxy_redirect off;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # Phase 15: stateless MCP Streamable HTTP for AI coding agents. Buffering stays off so an SSE
    # response streams straight through, and the read timeout covers a sandboxed build verification.
    location /mcp {
        proxy_pass http://api-python:8088/mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        # Session/Bearer auth and the MCP transport + observability headers pass through untouched.
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Mcp-Session-Id $http_mcp_session_id;
        proxy_set_header Mcp-Protocol-Version $http_mcp_protocol_version;
        proxy_set_header Mcp-Method $http_mcp_method;
        proxy_set_header Mcp-Name $http_mcp_name;
        proxy_set_header Accept $http_accept;
        proxy_pass_header Set-Cookie;
        proxy_redirect off;
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 10s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
    }

    location = /health {
        proxy_pass http://api-python:8088/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;
        proxy_redirect off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
    }
}
