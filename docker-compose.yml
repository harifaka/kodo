# Kodo local stack — `docker compose up --build` then open http://localhost:3000
# Production images: see docker-compose.prod.yml. Optional host mounts: docker-compose.override.yml.example.
name: kodo

services:
  analyzer-csharp:
    build:
      context: ./services/analyzer-csharp
      dockerfile: Dockerfile
    image: kodo-analyzer-csharp:local
    environment:
      ASPNETCORE_URLS: http://+:5050
      ASPNETCORE_ENVIRONMENT: Production
    # Published so a non-Docker FastAPI/uvicorn on the host can reach the analyzer on :5050.
    ports:
      - "5050:5050"
    networks:
      - kodo-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "-O", "/dev/null", "http://127.0.0.1:5050/health"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  api-python:
    build:
      context: ./services/api-python
      dockerfile: Dockerfile
    image: kodo-api-python:local
    environment:
      KODO_CSHARP_URL: http://analyzer-csharp:5050
      KODO_AUDIT_LOG_PATH: /data/kodo/audit.jsonl
      KODO_WORKSPACES_DIR: /data/kodo/workspaces
      # `local` is zero-configuration. `saas` requires KODO_JWT_SECRET and enables tenant isolation.
      KODO_MODE: ${KODO_MODE:-local}
      # Any SQLAlchemy URL works; default is SQLite on the kodo-data volume. For the bundled
      # Postgres profile use: postgresql+psycopg://kodo:kodo@postgres:5432/kodo
      KODO_DATABASE_URL: ${KODO_DATABASE_URL:-sqlite:////data/kodo/kodo.db}
      KODO_JWT_SECRET: ${KODO_JWT_SECRET:-}
      KODO_JWT_TTL_HOURS: ${KODO_JWT_TTL_HOURS:-24}
      KODO_COOKIE_SECURE: ${KODO_COOKIE_SECURE:-auto}
      KODO_PUBLIC_URL: ${KODO_PUBLIC_URL:-http://localhost:3000}
      KODO_GITHUB_CLIENT_ID: ${KODO_GITHUB_CLIENT_ID:-}
      KODO_GITHUB_CLIENT_SECRET: ${KODO_GITHUB_CLIENT_SECRET:-}
      KODO_GITHUB_SCOPES: ${KODO_GITHUB_SCOPES:-read:user user:email}
      # Empty => the built-in Vite dev origins; the Docker UI is same-origin through Nginx.
      KODO_CORS_ORIGINS: ${KODO_CORS_ORIGINS:-}
      KODO_LLM_BASE_URL: ${KODO_LLM_BASE_URL:-https://api.deepseek.com/v1}
      KODO_LLM_API_KEY: ${KODO_LLM_API_KEY:-}
      KODO_LLM_CODE_MODEL: ${KODO_LLM_CODE_MODEL:-deepseek-chat}
      KODO_LLM_REASONING_MODEL: ${KODO_LLM_REASONING_MODEL:-deepseek-reasoner}
      KODO_LLM_TIMEOUT_SECONDS: ${KODO_LLM_TIMEOUT_SECONDS:-90}
      # Phase 9 ephemeral builders. Images are built with `docker compose --profile builders build`
      # and the disposable containers are created through the mounted Docker socket (see
      # docker-compose.override.yml.example). Verification stays a reported status when Docker is absent.
      KODO_BUILDERS_ENABLED: ${KODO_BUILDERS_ENABLED:-true}
      KODO_BUILDER_IMAGE_JAVA: ${KODO_BUILDER_IMAGE_JAVA:-kodo-builder-java:local}
      KODO_BUILDER_IMAGE_CSHARP: ${KODO_BUILDER_IMAGE_CSHARP:-kodo-builder-csharp:local}
      KODO_BUILDER_IMAGE_NODEJS: ${KODO_BUILDER_IMAGE_NODEJS:-kodo-builder-nodejs:local}
      KODO_BUILDER_NETWORK_MODE: ${KODO_BUILDER_NETWORK_MODE:-none}
      KODO_BUILDER_TIMEOUT_SECONDS: ${KODO_BUILDER_TIMEOUT_SECONDS:-120}
      KODO_BUILDER_MEMORY: ${KODO_BUILDER_MEMORY:-1g}
      KODO_BUILDER_CPUS: ${KODO_BUILDER_CPUS:-1}
      KODO_BUILDER_PIDS_LIMIT: ${KODO_BUILDER_PIDS_LIMIT:-256}
    volumes:
      - kodo-data:/data/kodo
      # Host folder exposed as /projects for scanning; override with KODO_LOCAL_PROJECTS_DIR.
      - type: bind
        source: ${KODO_LOCAL_PROJECTS_DIR:-./.kodo-empty}
        target: /projects
    depends_on:
      analyzer-csharp:
        condition: service_healthy
      # Started only with `docker compose --profile saas up`; set KODO_DATABASE_URL to this service.
      postgres:
        condition: service_healthy
        required: false
    networks:
      - kodo-net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8088/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  # Optional ephemeral builder images (Phase 9). Build them once with
  # `docker compose --profile builders build`; the API then creates disposable, network-isolated
  # containers from these tags. They are build targets only and never part of a running stack.
  kodo-builder-java:
    profiles: ["builders"]
    build:
      context: ./services/builders/java
      dockerfile: Dockerfile
    image: ${KODO_BUILDER_IMAGE_JAVA:-kodo-builder-java:local}
    command: ["true"]
    restart: "no"

  kodo-builder-csharp:
    profiles: ["builders"]
    build:
      context: ./services/builders/csharp
      dockerfile: Dockerfile
    image: ${KODO_BUILDER_IMAGE_CSHARP:-kodo-builder-csharp:local}
    command: ["true"]
    restart: "no"

  kodo-builder-nodejs:
    profiles: ["builders"]
    build:
      context: ./services/builders/nodejs
      dockerfile: Dockerfile
    image: ${KODO_BUILDER_IMAGE_NODEJS:-kodo-builder-nodejs:local}
    command: ["true"]
    restart: "no"

  # Optional SaaS database: `docker compose --profile saas up`.
  # Point api-python at it with KODO_DATABASE_URL=postgresql+psycopg://kodo:kodo@postgres:5432/kodo
  # (or any managed PostgreSQL URL such as Supabase/Neon/RDS).
  postgres:
    image: postgres:16-alpine
    profiles: ["saas"]
    environment:
      POSTGRES_DB: ${KODO_POSTGRES_DB:-kodo}
      POSTGRES_USER: ${KODO_POSTGRES_USER:-kodo}
      POSTGRES_PASSWORD: ${KODO_POSTGRES_PASSWORD:-kodo}
    volumes:
      - kodo-pgdata:/var/lib/postgresql/data
    networks:
      - kodo-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    image: kodo-web:local
    ports:
      - "${KODO_WEB_PORT:-3000}:8080"
    depends_on:
      api-python:
        condition: service_healthy
    networks:
      - kodo-net
    healthcheck:
      # /health is proxied to FastAPI, so a green web container means the whole chain works.
      test: ["CMD", "wget", "--spider", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

volumes:
  kodo-data:
  kodo-pgdata:

networks:
  kodo-net:
    driver: bridge
