# Production override — pulls prebuilt GHCR images instead of building locally.
# Usage (requires Docker Compose >= 2.24 for `!reset`):
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
name: kodo

services:
  analyzer-csharp:
    build: !reset null
    image: ghcr.io/${KODO_IMAGE_OWNER:-harifaka}/kodo-analyzer-csharp:${KODO_TAG:-latest}
    ports: !reset []
    restart: unless-stopped

  api-python:
    build: !reset null
    image: ghcr.io/${KODO_IMAGE_OWNER:-harifaka}/kodo-api-python:${KODO_TAG:-latest}
    ports: !reset []
    # Production defaults to SaaS. Set a >=32 character KODO_JWT_SECRET and point
    # KODO_DATABASE_URL at PostgreSQL (bundled `--profile saas` or a managed provider).
    environment:
      KODO_MODE: ${KODO_MODE:-saas}
      KODO_DATABASE_URL: ${KODO_DATABASE_URL:-sqlite:////data/kodo/kodo.db}
      KODO_JWT_SECRET: ${KODO_JWT_SECRET:-}
      KODO_PUBLIC_URL: ${KODO_PUBLIC_URL:-http://localhost:3000}
      KODO_COOKIE_SECURE: ${KODO_COOKIE_SECURE:-auto}
      KODO_GITHUB_CLIENT_ID: ${KODO_GITHUB_CLIENT_ID:-}
      KODO_GITHUB_CLIENT_SECRET: ${KODO_GITHUB_CLIENT_SECRET:-}
    restart: unless-stopped

  web:
    build: !reset null
    image: ghcr.io/${KODO_IMAGE_OWNER:-harifaka}/kodo-web:${KODO_TAG:-latest}
    ports:
      - "${KODO_WEB_PORT:-3000}:8080"
    restart: unless-stopped
