# Alembic configuration for Kodo.
#
# There is deliberately no `sqlalchemy.url` here: `alembic/env.py` reads KODO_DATABASE_URL through
# `app.config` (and accepts the API's live engine connection when migrations run at startup), so the
# CLI (`alembic upgrade head`) and the running service always migrate the same database.
#
#   alembic upgrade head        # apply pending migrations
#   alembic current             # show the revision recorded in alembic_version
#   alembic revision -m "..."   # add a new migration (offline authoring)

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = %(here)s
path_separator = os
version_path_separator = os
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
